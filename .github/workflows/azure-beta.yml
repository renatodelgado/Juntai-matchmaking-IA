name: Deploy matchmaking beta
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: azure-beta-matchmaking
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests/test_rules.py tests/test_eligibility.py tests/test_service_auth.py -q
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Build and publish image
        env:
          REGISTRY: ${{ vars.AZURE_REGISTRY }}
        run: |
          az acr login --name "${REGISTRY%%.*}"
          docker build -t "$REGISTRY/matchmaking:$GITHUB_SHA" .
          docker push "$REGISTRY/matchmaking:$GITHUB_SHA"
      - name: Deploy revision
        env:
          REGISTRY: ${{ vars.AZURE_REGISTRY }}
        run: |
          az containerapp update --name juntai-beta-matchmaking --resource-group juntai-beta --image "$REGISTRY/matchmaking:$GITHUB_SHA" --output none
